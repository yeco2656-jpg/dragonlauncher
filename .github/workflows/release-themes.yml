name: Publish themes release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-themes.yml'
      - 'downloads/themes/*.zip'
      - 'downloads/themes/RELEASE_NOTES.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or refresh themes-1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -l downloads/themes
          if gh release view themes-1 >/dev/null 2>&1; then
            gh release edit themes-1 --title "主题包 v1 · 四套可下载" --notes-file downloads/themes/RELEASE_NOTES.md --latest=false
          else
            gh release create themes-1 --title "主题包 v1 · 四套可下载" --notes-file downloads/themes/RELEASE_NOTES.md --latest=false
          fi
          gh release upload themes-1 \
            downloads/themes/snowline.zip \
            downloads/themes/fjord.zip \
            downloads/themes/gorge.zip \
            downloads/themes/goldenfield.zip \
            downloads/themes/SHA256SUMS.txt \
            --clobber
          REL_ID=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/themes-1 --jq .id)
          gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/$REL_ID -F make_latest=false >/dev/null
          LATEST_VERSION=$(gh release list --limit 100 --json tagName \
            --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))] | sort_by(capture("^v(?<maj>[0-9]+)\\.(?<min>[0-9]+)\\.(?<pat>[0-9]+)") | [.maj, .min, .pat] | map(tonumber)) | last')
          echo "latest version: $LATEST_VERSION"
          if [ -n "$LATEST_VERSION" ]; then
            VID=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$LATEST_VERSION --jq .id)
            gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/$VID -F make_latest=true >/dev/null
          fi
          echo "latest now: $(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"
          gh release view themes-1 --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
